services:

  db:
  image: pgvector/pgvector:pg16
  environment:
    POSTGRES_DB: legal_case
    POSTGRES_USER: legal_case
    POSTGRES_PASSWORD: legal_case_dev_password
  volumes:
    - postgres_data:/var/lib/postgresql/data
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U legal_case -d legal_case"]

  backend:
    container_name: legal-case-backend

    build:
      context: ./backend
      dockerfile: Dockerfile

    command: >
      sh -c "
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --timeout 180
      "

    env_file:
      - ./backend/.env

    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      SQLITE_DB_PATH: /data/db.sqlite3
      DATABASE_URL: postgresql://legal_case:legal_case_dev_password@db:5432/legal_case

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - backend_db:/data
      - backend_media:/app/media
      - backend_static:/app/staticfiles

    ports:
      - "8000:8000"

    restart: unless-stopped


  frontend:
    container_name: legal-case-frontend

    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1

    volumes:
      - backend_media:/var/www/media:ro
      - backend_static:/var/www/static:ro

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  backend_db:
    name: legal_case_database

  backend_media:
    name: legal_case_media

  backend_static:
    name: legal_case_static